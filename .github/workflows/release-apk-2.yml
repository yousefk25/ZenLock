name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Sign Playstore Release APK
        working-directory: ZenLock-Android
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlaystoreRelease

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/playstore/release -name "*.apk" | head -n 1)

          keytool -genkeypair -v -keystore release.keystore -alias zenlock -keyalg RSA -keysize 2048 -validity 10000 -storepass zenlockpass -keypass zenlockpass -dname "CN=ZenLock, OU=Dev, O=Personal, L=Cairo, ST=Cairo, C=EG"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias zenlock --ks-pass pass:zenlockpass --key-pass pass:zenlockpass --out app-release-signed.apk aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenLock-Release-APK
          path: ZenLock-Android/app-release-signed.apk
          
