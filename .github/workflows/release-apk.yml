name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and Sign Release APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          keytool -genkeypair -v -keystore release.keystore -alias zenlock -keyalg RSA -keysize 2048 -validity 10000 -storepass zenlockpass -keypass zenlockpass -dname "CN=ZenLock, OU=Dev, O=Personal, L=Cairo, ST=Cairo, C=EG"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias zenlock --ks-pass pass:zenlockpass --key-pass pass:zenlockpass --out app-release-signed.apk aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenLock-Release-APK
          path: "**/app-release-signed.apk"
          
